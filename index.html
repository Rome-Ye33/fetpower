    <style>#boot{color:#64748b;text-align:center;background:#f3f5f9;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:24px;font:14px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,PingFang SC,Microsoft YaHei,sans-serif;display:flex;position:fixed;inset:0}#boot-spin{border:3px solid #dbe4f3;border-top-color:#2563eb;border-radius:50%;width:28px;height:28px;animation:.8s linear infinite boot-spin}#boot-slow{font-size:13px;display:none}#boot button{color:#2563eb;font:inherit;cursor:pointer;background:#fff;border:1px solid #2563eb;border-radius:6px;margin-left:4px;padding:2px 12px}@keyframes boot-spin{to{transform:rotate(360deg)}}</style>
    <script>
      // 网页还没出来时（文件还在下载）显示「正在打开」，不再整页白着（Rome 2026-11-19「怎么有点卡」）。
      // 网页的文件拿不到（刚更新完浏览器还拿着旧首页、网断了）：自动刷新一次换成新版；一分钟内刷过还不行，就写明并给「刷新」。
      // 网页出来以后 #boot 就被换掉了，这里不再管；之后拿不到文件由 src/lib/updateReload.ts 管（同一个记号，两边加起来一分钟也只刷一次）。
      ;(function () {
        function failed() {
          if (!document.getElementById('boot')) return
          var key = 'auto-reload-at'
          var last = 0
          try {
            last = Number(sessionStorage.getItem(key) || 0)
          } catch (e) {}
          if (Date.now() - last > 60000) {
            try {
              sessionStorage.setItem(key, String(Date.now()))
              location.reload()
              return
            } catch (e) {}
          }
          var spin = document.getElementById('boot-spin')
          var msg = document.getElementById('boot-msg')
          var slow = document.getElementById('boot-slow')
          if (spin) spin.style.display = 'none'
          if (slow) slow.style.display = 'none'
          if (msg) msg.innerHTML = '网页没打开 Page failed to load <button type="button" onclick="location.reload()">刷新 Reload</button>'
        }
        window.addEventListener(
          'error',
          function (e) {
            if (e.target && e.target.tagName === 'SCRIPT') failed()
          },
          true,
        )
        setTimeout(function () {
          var slow = document.getElementById('boot-slow')
          if (document.getElementById('boot-spin') && slow && document.getElementById('boot-spin').style.display !== 'none') slow.style.display = 'block'
        }, 15000)
      })()
    </script>
