name: 发布网站

# 推到 main 后自动打包，把 dist 推到 gh-pages 分支；GitHub Pages 从 gh-pages 分支发布
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 带上上一版的文件
        continue-on-error: true
        # 更新以后，还开着上一版网页（或浏览器、CDN 还缓存着上一版首页）的人会去拿上一版的文件；
        # 以前一更新就全删了，拿不到就白屏（Rome 2026-11-19「怎么有点卡」）。现在上一版的文件多留一版，再早的不留。
        # assets-list.txt 记着这一版自己的文件，下次发布时只带上这些。
        run: |
          (cd dist/assets && ls -1) > dist/assets-list.txt
          if git fetch -q --depth=1 origin gh-pages; then
            mkdir -p "$RUNNER_TEMP/old"
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/old"
            if [ -f "$RUNNER_TEMP/old/assets-list.txt" ]; then
              cp "$RUNNER_TEMP/old/assets-list.txt" "$RUNNER_TEMP/prev.txt"
            else
              (cd "$RUNNER_TEMP/old/assets" 2>/dev/null && ls -1) > "$RUNNER_TEMP/prev.txt" || true
            fi
            kept=0
            while IFS= read -r f; do
              if [ -n "$f" ] && [ -f "$RUNNER_TEMP/old/assets/$f" ] && [ ! -e "dist/assets/$f" ]; then
                cp "$RUNNER_TEMP/old/assets/$f" "dist/assets/$f"
                kept=$((kept + 1))
              fi
            done < "$RUNNER_TEMP/prev.txt"
            echo "带上上一版的文件 $kept 个"
          else
            echo "还没有 gh-pages 分支，不用带"
          fi
      - name: 推到 gh-pages 分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "发布 ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
